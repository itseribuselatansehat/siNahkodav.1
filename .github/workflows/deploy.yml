name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: 🚀 Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm install

      - name: 🏗️ Build production application
        run: npm run build

      - name: 🌐 Deploy to Hostinger via FTP
        if: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./public_html/
          dangerous-clean-slate: false

      - name: ℹ️ Catatan Deployment
        if: ${{ secrets.FTP_SERVER == '' || secrets.FTP_USERNAME == '' || secrets.FTP_PASSWORD == '' }}
        run: |
          echo "=========================================================="
          echo "Build SI NAKHODA berhasil!"
          echo "Jika ingin otomatis upload via FTP ke Hostinger:"
          echo "Tambahkan Secrets di GitHub: Settings -> Secrets and variables -> Actions"
          echo "  - FTP_SERVER (contoh: ftp.domainanda.com atau IP Hostinger)"
          echo "  - FTP_USERNAME (username FTP dari hPanel Hostinger)"
          echo "  - FTP_PASSWORD (password FTP dari hPanel Hostinger)"
          echo "Atau gunakan fitur Hostinger Git / Webhook di hPanel."
          echo "=========================================================="
